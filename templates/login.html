{% extends "base.html" %}

{% block title %}Iniciar Sesión - FinTrack{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="brand-logo-icon" style="margin: 0 auto 0.75rem auto; width: 48px; height: 48px; font-size: 1.5rem;">
        🔐
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--color-dark); margin-bottom: 0.35rem;">
        Bienvenido a FinTrack
      </h1>
      <p style="color: var(--color-slate-600); font-size: 0.9rem;">
        Ingresa tus credenciales para acceder a tu panel financiero
      </p>
    </div>

    <!-- Formulario de inicio de sesión -->
    <form action="{{ url_for('login') }}" method="POST" autocomplete="on">
      <div class="form-group">
        <label for="correo" class="form-label">Correo Electrónico</label>
        <input 
          type="email" 
          id="correo" 
          name="correo" 
          class="form-input" 
          placeholder="ejemplo@correo.com" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input 
          type="password" 
          id="contrasena" 
          name="contrasena" 
          class="form-input" 
          placeholder="••••••••" 
          required
        >
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block">
          Ingresar al Sistema
        </button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--color-slate-200); font-size: 0.9rem; color: var(--color-slate-600);">
      ¿No tienes una cuenta aún? 
      <a href="{{ url_for('registro') }}" style="font-weight: 600;">Crea una cuenta aquí</a>
    </div>
  </div>
</div>
{% endblock %}
